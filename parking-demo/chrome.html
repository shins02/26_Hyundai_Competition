<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S J Story · 지상·야외 주차 메모</title>
<style>*{box-sizing:border-box}body{margin:0;background:#19211f;color:#f5f8f6;font:16px/1.55 system-ui,sans-serif}main{max-width:980px;margin:5vh auto;padding:24px}small{color:#9ae4c6}h1{margin:.25em 0;font-size:36px}h2{font-size:19px}section{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}article,aside{border:1px solid #40524a;border-radius:16px;background:#232e28;padding:20px}img{width:100%;height:245px;object-fit:contain;background:#111}button,input,select{font:inherit;border-radius:7px;padding:6px;margin:.25em 0}button{cursor:pointer}button:disabled{opacity:.55}#park{background:#b1f2d0;font-weight:650}strong,output{display:block;font-size:25px}label{display:inline-block}input[type=text]{width:100%}#status{min-height:24px}@media(max-width:720px){section{grid-template-columns:1fr}main{margin:0;padding:14px}}</style>
<main><small>S J Story ／ 주차 메모</small><h1>내 차, 어디에 세웠지?</h1><p>주차 직전의 표지판 사진에서 층·구역과 위치 표지를 읽습니다.</p><section><article>
<h2>차량 카메라 입력</h2><img id="frame" alt="주차 직전 사진"><div><select aria-label="샘플" id="sample"><option value="04">지상 주차타워</option><option value="05">야외 주차장</option><option value="01">지하 2층</option><option value="02">지하 3층</option><option value="03">기둥 미표시</option></select> <button id="pick">사진 열기…</button><input type="file" hidden id="file" accept="image/jpeg,image/png,image/heic"></div>
<button id="park">주차 완료 · P단 모의 입력</button><p id="status" role="status"></p><div id="edit" hidden><label>층 또는 구역<input type="text" id="place"></label> <label>위치 표지<input type="text" id="marker"></label> <button id="save">확인·저장</button></div></article>
<aside><small>마이현대 연동 제안 · 모의 화면</small><h2>최근 주차 알림</h2><strong id="locationLabel">아직 기록이 없습니다</strong><output id="markerLabel"></output><p id="when"></p><p>사진은 이 Mac의 문자 인식기로 처리합니다. 휴대폰 알림은 이 화면에서 시연합니다.</p></aside></section></main>
<script>
const el=id=>document.getElementById(id);let version=0, imageFile=null, url=null;
function reset(){version++;el('park').disabled=false;el('edit').hidden=true;el('place').value=el('marker').value='';el('status').textContent='기어 D · 주차 완료를 눌러 주세요.';if(url)URL.revokeObjectURL(url);url=null}
function sample(){imageFile=null;reset();el('frame').src='samples/'+el('sample').value+'.jpg'}
function show(note){el('locationLabel').textContent=note.place;el('markerLabel').textContent=note.marker?note.marker+' 표지 옆':'';el('when').textContent=note.time}
function save(){const place=el('place').value.trim(),marker=el('marker').value.trim();if(!place||(!marker&&!place.includes('구역'))){el('status').textContent='층과 위치 표지 또는 구역을 확인해 주세요.';return}const note={place,marker,time:new Date().toLocaleString('ko-KR')};show(note);try{localStorage.setItem('gil-parking-v1',JSON.stringify(note))}catch{}el('status').textContent='모의 알림에 주차 위치를 저장했습니다.'}
el('sample').onchange=sample;el('pick').onclick=()=>el('file').click();el('file').onchange=()=>{if(!el('file').files.length)return;reset();imageFile=el('file').files[0];url=URL.createObjectURL(imageFile);el('frame').src=url;el('file').value=''};
el('save').onclick=save;el('park').onclick=async()=>{let job=++version;el('park').disabled=true;el('status').textContent='기어 P · 표지판을 읽고 있습니다…';try{const source=imageFile||await (await fetch(el('frame').src)).blob();const res=await fetch('read',{method:'POST',body:source});if(!res.ok)throw Error();const r=await res.json();if(job!==version)return;el('place').value=r.place;el('marker').value=r.marker;el('edit').hidden=false;if(r.auto)save();else el('status').textContent='사진을 확인하고 위치를 보완해 주세요.'}catch{if(job!==version)return;el('edit').hidden=false;el('status').textContent='사진을 읽지 못했습니다. 사진을 확인하고 직접 입력해 주세요.'}};
sample();try{const n=JSON.parse(localStorage.getItem('gil-parking-v1'));if(n)show(n)}catch{}
</script></html>
